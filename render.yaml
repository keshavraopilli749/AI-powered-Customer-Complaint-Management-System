# render.yaml - Infrastructure as Code for Render.com

databases:
  - name: qms-postgres
    databaseName: qms_db
    user: admin
    plan: free

services:
  # 1. FastAPI Backend
  - type: web
    name: qms-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qms-postgres
          property: connectionString
      - key: GROQ_API_KEY
        sync: false # You will input this manually in the Render Dashboard

  # 2. React Frontend
  - type: web
    name: qms-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://qms-backend.onrender.com/api/v1" 
        # (Note: If your backend name changes, update the URL above)
